<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>忘了那个该死的人</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:linear-gradient(135deg,#171526,#30213d 48%,#141827);
    color:#fff; display:flex; align-items:center; justify-content:center;
  }
  .stars,.stars:before,.stars:after{
    content:""; position:absolute; inset:0; background-image:
    radial-gradient(circle at 20% 20%,rgba(255,255,255,.7) 1px,transparent 1.5px),
    radial-gradient(circle at 70% 30%,rgba(255,255,255,.45) 1px,transparent 1.5px),
    radial-gradient(circle at 40% 75%,rgba(255,255,255,.35) 1px,transparent 1.5px);
    background-size:120px 120px,180px 180px,230px 230px; opacity:.45;
  }
  .card{
    position:relative; width:min(92vw,680px); padding:52px 34px 38px;
    text-align:center; border:1px solid rgba(255,255,255,.13);
    border-radius:30px; background:rgba(255,255,255,.075);
    backdrop-filter:blur(18px); box-shadow:0 25px 80px rgba(0,0,0,.38);
  }
  .heart{font-size:54px; filter:drop-shadow(0 8px 20px rgba(255,95,135,.35)); animation:pulse 1.8s infinite}
  h1{font-size:clamp(34px,8vw,62px); margin:15px 0 10px; letter-spacing:2px}
  .sub{font-size:18px; color:#d8d0df; line-height:1.8; margin-bottom:28px}
  .message{
    min-height:118px; display:flex; align-items:center; justify-content:center;
    padding:20px; border-radius:20px; background:rgba(0,0,0,.18);
    color:#fff4f7; font-size:21px; line-height:1.7;
  }
  button{
    margin-top:25px; border:0; padding:14px 28px; border-radius:999px;
    font-size:16px; font-weight:700; color:white; cursor:pointer;
    background:linear-gradient(90deg,#ff5f87,#a86cff);
    box-shadow:0 10px 25px rgba(255,95,135,.22); transition:.2s;
  }
  button:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(255,95,135,.32)}
  .small{margin-top:22px;color:#9f96aa;font-size:13px}
  .quote{margin-top:30px;font-size:15px;color:#c7bfcc}
  @keyframes pulse{50%{transform:scale(1.08)}}
  .float{position:absolute;bottom:-30px;font-size:22px;animation:rise 7s linear infinite;opacity:0}
  @keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}15%{opacity:.7}100%{transform:translateY(-110vh) rotate(30deg);opacity:0}}
</style>
</head>
<body>
<div class="stars"></div>
<div class="float" style="left:8%;animation-delay:0s">♡</div>
<div class="float" style="left:22%;animation-delay:2s">✦</div>
<div class="float" style="left:78%;animation-delay:1s">♡</div>
<div class="float" style="left:90%;animation-delay:4s">✦</div>

<main class="card">
  <div class="heart">❤️‍🩹</div>
  <h1>忘了那个该死的人</h1>
  <div class="sub">听我一句。<br>你不是失去了全世界，你只是终于不用再委屈自己了。</div>

  <div class="message" id="message">
    有些人离开，不是你的失败。<br>是生活终于替你按下了“及时止损”。
  </div>

  <button onclick="comfort()">再安慰我一句</button>

  <div class="quote">你值得被坚定地选择，而不是被反复地消耗。</div>
  <div class="small">今晚先别想TA了。洗个澡，吃点东西，睡一觉。明天继续做那个很酷的自己。</div>
</main>

<script>
const lines = [
  "别回头了。那个人已经是过去式，而你的人生还在进行时。",
  "你怀念的可能不是TA，而是那个曾经满怀期待的自己。",
  "真正爱你的人，不会让你长期靠猜、靠等、靠忍。",
  "删掉聊天记录不是输，是给自己腾出一点重新呼吸的空间。",
  "你会有一天突然发现：原来当初放不下的人，也不过如此。",
  "别把一个人的离开，解释成自己的不值得。错的人，谁遇见谁都不合适。",
  "今晚可以难过，但别再为一个不珍惜你的人惩罚自己。",
  "该翻篇了。不是因为不痛了，而是因为你终于决定把自己放在第一位。",
  "那个该死的人爱不爱你已经不重要了——你得开始好好爱自己。",
  "总有一天，你会庆幸自己没有一直困在那段关系里。"
];
function comfort(){
  const box=document.getElementById("message");
  const text=lines[Math.floor(Math.random()*lines.length)];
  box.style.opacity=0;
  setTimeout(()=>{box.innerHTML=text;box.style.opacity=1},180);
}
</script>
</body>
</html>
